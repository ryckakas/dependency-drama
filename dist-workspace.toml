[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. npm is here so `npx dependency-drama` works without
# installing anything, which is the cheapest way to run this in CI.
installers = ["shell", "powershell", "homebrew", "npm"]
# homebrew-core rejects prebuilt binaries, so the formula goes to a personal tap.
# Publishing needs a HOMEBREW_TAP_TOKEN secret with write access to that repo.
tap = "ryckakas/homebrew-tap"
# npm is published by publish-npm.yml instead: npm wants `npm stage publish` from npm 11.15 or
# newer, and dist's npm job runs `npm publish` on Node 20. dist still builds the npm package.
publish-jobs = ["homebrew", "./publish-crates"]
# crates.io trusted publishing needs only an identity token; dist's default for a custom publish
# job adds packages: write, which this one has no use for.
github-custom-job-permissions = { "publish-crates" = { contents = "read", id-token = "write" } }
# A published shrinkwrap makes npm materialise the generated package's whole dependency tree
# for consumers, dev entries included. Without it, npm resolves the real dependency normally.
npm-shrinkwrap = false
# The release workflow runs only for a pushed release tag, not on every pull request.
pr-run-mode = "skip"
# Installs current stable Rust in each build job: the runner's own Rust can be older than
# rust-version.
github-build-setup = "../build-setup.yml"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

# dist 0.33.0 defaults this target to macos-14, which GitHub retired on 2026-11-02.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

# The commits release.yml runs, so a moved tag cannot change what the release runs. `dist
# generate` writes these over release.yml, so a Dependabot bump of release.yml belongs here too,
# or the next generate undoes it.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"          # v7.0.1
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/setup-node" = "949feb2413d6458794dcd2491c4babbbce0c15c1"        # v7.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"   # v7.0.2
