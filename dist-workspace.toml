[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. npm is here so `npx dependency-drama` works without
# installing anything, which is the cheapest way to run this in CI.
installers = ["shell", "powershell", "homebrew", "npm"]
# homebrew-core rejects prebuilt binaries, so the formula goes to a personal tap.
# Publishing needs a HOMEBREW_TAP_TOKEN secret with write access to that repo.
tap = "ryckakas/homebrew-tap"
# npm publishing needs an NPM_TOKEN secret.
publish-jobs = ["homebrew", "npm"]
# A published shrinkwrap makes npm materialise the generated package's whole dependency tree
# for consumers, dev entries included. Without it, npm resolves the real dependency normally.
npm-shrinkwrap = false
# The release workflow runs only for a pushed release tag, not on every pull request.
pr-run-mode = "skip"
# Installs current stable Rust in each build job: the runner's own Rust can be older than
# rust-version.
github-build-setup = "../build-setup.yml"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

# dist 0.33.0 defaults this target to macos-14, which GitHub retired on 2026-11-02.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

# The commits behind the tags dist 0.33.0 uses, so a moved tag cannot change what the release
# runs. Upgrading dist can change those tags: re-pin to the new ones, then run `dist generate`.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"          # v6.1.0
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/setup-node" = "249970729cb0ef3589644e2896645e5dc5ba9c38"        # v6.5.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"   # v7.0.1
