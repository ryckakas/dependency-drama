# Policy for `cargo deny check`, which CI runs on every pull request.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# What the dependency tree uses today. A dependency under anything else fails until it is added.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    # The Mozilla root certificates that the registry lookups trust, as data.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[bans]
# A second copy of a crate costs compile time and binary size, so it has to be chosen.
multiple-versions = "deny"
wildcards = "deny"
# ring, under the TLS that the registry lookups use, is a release behind.
skip = [{ crate = "windows-sys@0.52", reason = "ring 0.17 depends on it" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
