name: Drama

# The project's own action, run on its own pull requests against the test fixture. It is the only
# place the action is exercised before a release, so it builds the binary from this checkout.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  episode:
    name: Episode (${{ matrix.checkout }})
    runs-on: ubuntu-latest
    # The default checkout of a pull request is GitHub's merge commit; some workflows check out the
    # pull request's head instead, and the action finds its base differently for each.
    strategy:
      fail-fast: false
      matrix:
        checkout: [merge, head]
    permissions:
      contents: read
      # The comment on a pull request that changes the fixture's lockfile.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.checkout == 'head' && github.event.pull_request.head.sha || '' }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build this checkout's binary
        run: cargo install --path . --locked --debug

      # Only one of the two may own the comment for each directory.
      - uses: ./
        with:
          path: tests/fixtures/shop-web
          comment: ${{ matrix.checkout == 'merge' }}

      - uses: ./
        with:
          path: tests/fixtures/pnpm-monorepo
          comment: ${{ matrix.checkout == 'merge' }}
