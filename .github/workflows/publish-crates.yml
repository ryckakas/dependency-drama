name: Publish to crates.io

# Deliberately a separate workflow: release.yml is generated by dist and must not be
# hand-edited, and dist has no crates.io publish job. Kept on manual dispatch rather than
# a tag trigger because cargo publish cannot be undone: a version, once taken, is taken
# even if the publish later fails.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, e.g. v0.1.0"
        required: true
        type: string
      dry_run:
        description: "Verify only, publish nothing"
        required: true
        type: boolean
        default: true
      first_publish:
        description: "Create the crate on crates.io, which has never seen it, with CARGO_REGISTRY_TOKEN"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Trusted publishing: GitHub's identity token for this run buys a crates.io token that lasts
      # 30 minutes and is revoked when the job ends. crates.io allows that only once the crate
      # exists there, so the very first publish uses an API token instead. A dry run uploads
      # nothing, so it needs no token.
      - name: Authenticate with crates.io
        id: auth
        if: ${{ !inputs.dry_run && !inputs.first_publish }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # --locked makes a lockfile that disagrees with Cargo.toml a failure, not a silent rewrite.
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ inputs.first_publish && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --locked --dry-run
          else
            cargo publish --locked
          fi
