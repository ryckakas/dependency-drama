name: Publish to crates.io

# Called by release.yml as a dist publish job, so a pushed release tag publishes the crate after
# the release is built and before it is announced: `publish-jobs` in dist-workspace.toml. Manual
# dispatch stays for a dry run, or to retry a release whose publish failed. cargo publish cannot
# be undone: a version, once taken, is taken even if the publish later fails.
on:
  workflow_call:
    inputs:
      # dist passes its release plan to every publish job; the tag is all this one needs.
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, e.g. v0.1.0"
        required: true
        type: string
      dry_run:
        description: "Verify only, publish nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Called from release.yml, github.ref is the pushed tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Trusted publishing: GitHub's identity token for this run buys a crates.io token that lasts
      # 30 minutes and is revoked when the job ends. A dry run uploads nothing, so it needs no token.
      - name: Authenticate with crates.io
        id: auth
        if: ${{ !inputs.dry_run }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # --locked makes a lockfile that disagrees with Cargo.toml a failure, not a silent rewrite.
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --locked --dry-run
          else
            cargo publish --locked
          fi
