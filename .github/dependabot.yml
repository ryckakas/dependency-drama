version: 2

# Cooldown holds a release for seven days before proposing it: a malicious or broken publish is
# usually caught and yanked within the week, before it reaches a lockfile.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The actions are pinned to a commit with the version in a comment; Dependabot moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
