# zizmor, run by CI's required "Workflow security" job. release.yml is written by `dist generate`,
# so these findings are dist's template and cannot be fixed by hand; its action pins live in
# dist-workspace.toml. Each is pinned to the line and column that was reviewed, so a regenerated
# release.yml fails the job until every finding in it has been looked at again.
rules:
  # Accepted risk, and the largest: dist grants contents: write to every job, and its build jobs
  # export GH_TOKEN, so a dependency's build script in a release build can use a write token.
  # dist has no setting to narrow it.
  excessive-permissions:
    ignore:
      - release.yml:18:3
  # Tag names and dist's own plan output. The workflow runs only for a pushed release tag, and
  # only the owner can push one.
  template-injection:
    ignore:
      - release.yml:79:91
      - release.yml:135:18
      - release.yml:145:15
      - release.yml:149:26
      - release.yml:149:98
      - release.yml:202:26
      - release.yml:252:25
      - release.yml:283:34
  # dist's optional build container, which none of this project's targets sets.
  unpinned-images:
    ignore:
      - release.yml:110:66
  # drama.yml runs the action from its own checkout with `./`, which is the point of that workflow.
  self-repository:
    ignore:
      - drama.yml:46:15
      - drama.yml:51:15
